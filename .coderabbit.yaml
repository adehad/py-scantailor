---
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

# CRITICAL: Set architectural context for all reviews
tone_instructions: "Senior engineer reviewing a C++ to Python migration. Be thorough, question C++ patterns, verify thread safety. Production-quality standards."

early_access: false
enable_free_tier: true

reviews:
  # Assertive profile for stricter enforcement during migration
  profile: assertive

  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: '@coderabbitai summary'
  high_level_summary_in_walkthrough: false
  auto_title_placeholder: '@coderabbitai'
  auto_title_instructions: ''
  review_status: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  poem: false

  labeling_instructions: []

  path_filters:
    - "!src/scantailor/app/_ui/**"
    - "!**/*.pyc"
    - "!**/__pycache__/**"
    - "!dist/**"
    - "!build/**"
    - "!*.egg-info/**"

  # All coding standards and review guidance are in AGENTS.md (single source of truth)
  # CI handles: formatting, imports, type hints, docstring presence
  path_instructions:
    - path: "**/*.py"
      instructions: |
        Apply all guidelines from AGENTS.md in the repository root.
        Focus on the "Code Review Focus" section - review what linters cannot catch.

  abort_on_close: true
  disable_cache: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches: []

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  # TOOLS: Default is enabled=true for all tools
  # Only specify tools we need to DISABLE or CONFIGURE
  tools:
    ast-grep:
      essential_rules: true

    ruff:
      enabled: true
      config_file: "pyproject.toml"

    # DISABLE irrelevant language-specific tools
    eslint:
      enabled: false
    biome:
      enabled: false
    swiftlint:
      enabled: false
    phpstan:
      enabled: false
    golangci-lint:
      enabled: false
    detekt:
      enabled: false
    rubocop:
      enabled: false
    buf:
      enabled: false
    regal:
      enabled: false
    pmd:
      enabled: false
    cppcheck:
      enabled: false
    clippy:
      enabled: false
    sqlfluff:
      enabled: false
    prismaLint:
      enabled: false
    oxc:
      enabled: false
    shopifyThemeCheck:
      enabled: false
    luacheck:
      enabled: false
    brakeman:
      enabled: false
    htmlhint:
      enabled: false
    hadolint:
      enabled: false
    checkov:
      enabled: false
    flake8:
      enabled: false
    circleci:
      enabled: false

# Implicitly enabled (defaults): pylint, gitleaks, yamllint, markdownlint,
# languagetool, github-checks, semgrep, shellcheck, actionlint, checkmake, dotenvLint

chat:
  auto_reply: true
  integrations:
    jira:
      usage: auto
    linear:
      usage: auto

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    usage: auto
    project_keys: []
  linear:
    usage: auto
    team_keys: []
  pull_requests:
    scope: auto

code_generation:
  docstrings:
    language: en-US
    path_instructions: []
  unit_tests:
    path_instructions: []
