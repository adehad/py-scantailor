---
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  QT_SELECT: "qt6"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  run:
    # To add a platform or Python version, copy this job.
    name: Python 3.14 on Linux
    runs-on: ubuntu-latest
    # A clean run takes about 5 minutes; a hung Qt test would hold the runner for hours.
    timeout-minutes: 10
    env:
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Qt system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-wayland \
            qt6-l10n-tools \
            qtchooser
          qtchooser -install qt6 $(which qmake6)

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.14"
          cache: true

      - name: Cache numba compiled functions
        uses: actions/cache@v4
        with:
          path: ${{ env.NUMBA_CACHE_DIR }}
          key: numba-${{ runner.os }}-${{ hashFiles('pdm.lock', 'tests/filters/page_split/cpp_reference.py') }}
          # numba checks each entry against its source file's hash, so a
          # cache from an older commit is still safe to restore.
          restore-keys: numba-${{ runner.os }}-

      - name: Install dependencies
        run: pdm install

      - name: Run lints  # These benefit from the autogenerated files
        run: pdm run typecheck

      - name: Run tests
        run: pdm run cov

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./dist/cov/coverage.xml
          name: ${{ runner.os }}-3.14
