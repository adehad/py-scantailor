---
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  run:
    # To add a platform or Python version, copy this job.
    name: Python 3.14 on Linux
    runs-on: ubuntu-latest
    # The limit stops a hung Qt test from using up the free CI minutes.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The shared libraries the PySide6 and opencv-python wheels load, as in
      # .readthedocs.yaml. The packages come from the Actions cache, so a slow apt
      # mirror only matters when this list changes.
      - name: Install Qt runtime libraries
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: >-
            libgl1 libegl1 libopengl0 libglib2.0-0t64 libfontconfig1 libfreetype6
            libxkbcommon0 libdbus-1-3 fonts-dejavu-core
          version: "1"

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.14"
          cache: true

      - name: Install dependencies
        run: pdm install

      - name: Run lints  # These benefit from the autogenerated files
        run: pdm run typecheck

      # Every test, the slow ones included. The manual's screenshots run in the
      # docs build and the benchmarks only by hand.
      - name: Run tests
        run: pdm run cov -m "not benchmark and not docs_screenshot"

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./dist/cov/coverage.xml
          name: ${{ runner.os }}-3.14

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
