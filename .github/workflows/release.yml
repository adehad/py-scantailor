# Release: on a pushed v* tag, freeze with PyInstaller on Windows, Linux and
# macOS, check each build and attach the archives to a GitHub Release.
# A manual run (workflow_dispatch) builds and checks without publishing.
#
# Each build adds scantailor-checks (SCANTAILOR_BUILD_CHECKS=1, see app.spec),
# runs it with the CLI smoke test against the folder that ships and deletes it
# before archiving.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  QT_QPA_PLATFORM: "offscreen"
  SCANTAILOR_BUILD_CHECKS: "1"

jobs:
  windows:
    name: Build (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # pdm derives the version from the tag, which a shallow clone lacks.
          fetch-depth: 0

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.14"
          cache: true

      - name: Cache numba compiled functions
        uses: actions/cache@v4
        with:
          path: ${{ env.NUMBA_CACHE_DIR }}
          key: numba-${{ runner.os }}-${{ hashFiles('pdm.lock', 'src/**/*.py') }}
          # numba checks each entry against its source file's hash, so a
          # cache from an older commit is still safe to restore.
          restore-keys: numba-${{ runner.os }}-

      # The smoke test needs only the runtime packages; pdm run exe
      # freezes from its own environment (tools/build_exe.py).
      - name: Install dependencies
        run: pdm install --frozen-lockfile --prod

      - name: Compile translations
        run: pdm run translations

      - name: Build executables
        run: pdm run exe

      - name: Smoke test the CLI
        run: dist/ScanTailor/scantailor-cli.exe --help

      - name: Smoke test a frozen batch run and the frozen checks
        run: >-
          pdm run python tools/smoke_frozen.py dist/ScanTailor/scantailor-cli.exe
          --checks dist/ScanTailor/scantailor-checks.exe

      - name: Remove the checks
        run: rm dist/ScanTailor/scantailor-checks.exe

      - name: Archive
        id: archive
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then label="$GITHUB_REF_NAME"; else label="${GITHUB_SHA::7}"; fi
          name="ScanTailor-${label}-windows-x64.zip"
          (cd dist && pdm run python -m zipfile -c "../${name}" ScanTailor)
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: release-windows-x64
          path: ${{ steps.archive.outputs.name }}
          if-no-files-found: error

  linux:
    name: Build (linux-x64)
    # The oldest runner image, so the bundled libraries ask for the oldest glibc.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.14"
          cache: true

      # PyInstaller bundles the Qt plugins' shared-library dependencies, so the
      # xcb libraries PySide6 needs must be on the build machine.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install dependencies
        run: pdm install --frozen-lockfile --prod

      - name: Compile translations
        run: pdm run translations

      - name: Build executables
        run: pdm run exe

      - name: Smoke test a frozen batch run and the frozen checks
        run: >-
          pdm run python tools/smoke_frozen.py dist/ScanTailor/scantailor-cli
          --checks dist/ScanTailor/scantailor-checks

      - name: Remove the checks
        run: rm dist/ScanTailor/scantailor-checks

      - name: Archive
        id: archive
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then label="$GITHUB_REF_NAME"; else label="${GITHUB_SHA::7}"; fi
          name="ScanTailor-${label}-linux-x64.tar.gz"
          tar -C dist -czf "${name}" ScanTailor
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: release-linux-x64
          path: ${{ steps.archive.outputs.name }}
          if-no-files-found: error

  macos:
    name: Build (macos-arm64)
    # pikepdf publishes Apple Silicon wheels for macOS 15 and later only.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.14"
          cache: true

      - name: Install dependencies
        run: pdm install --frozen-lockfile --prod

      - name: Compile translations
        run: pdm run translations

      - name: Build executables
        run: pdm run exe

      - name: Smoke test a frozen batch run and the frozen checks
        run: >-
          pdm run python tools/smoke_frozen.py dist/ScanTailor.app/Contents/MacOS/scantailor-cli
          --checks dist/ScanTailor.app/Contents/MacOS/scantailor-checks

      # Deleting a file from the signed bundle invalidates its ad-hoc signature,
      # so the bundle is signed again.
      - name: Remove the checks
        run: |
          rm -f dist/ScanTailor/scantailor-checks dist/ScanTailor.app/Contents/MacOS/scantailor-checks
          codesign --force --sign - dist/ScanTailor.app
          codesign --verify --deep --strict dist/ScanTailor.app

      - name: Archive
        id: archive
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then label="$GITHUB_REF_NAME"; else label="${GITHUB_SHA::7}"; fi
          name="ScanTailor-${label}-macos-arm64.zip"
          # ditto keeps the bundle's symlinks and code signature, which zip drops.
          ditto -c -k --keepParent dist/ScanTailor.app "${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: release-macos-arm64
          path: ${{ steps.archive.outputs.name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: >-
            ${{
              contains(github.ref_name, '-rc')
              || contains(github.ref_name, '-alpha')
              || contains(github.ref_name, '-beta')
            }}
