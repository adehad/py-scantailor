# Release: on a pushed v* tag, test, freeze with PyInstaller and attach the
# archives to a GitHub Release. Add a platform by adding a matrix entry.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            cli: dist/ScanTailor/scantailor-cli.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # pdm derives the version from the tag, which a shallow clone lacks.
          fetch-depth: 0

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"
          cache: true

      - name: Install dependencies
        run: pdm install --frozen-lockfile -G test -G installer

      - name: Compile translations
        run: pdm run translations

      - name: Run tests
        run: pdm run pytest

      - name: Build executables
        run: pdm run exe

      - name: Smoke test the CLI
        run: ${{ matrix.cli }} --help

      - name: Archive
        id: archive
        run: |
          name="ScanTailor-${GITHUB_REF_NAME}-${{ matrix.label }}.zip"
          (cd dist && pdm run python -m zipfile -c "../${name}" ScanTailor)
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.label }}
          path: ${{ steps.archive.outputs.name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: >-
            ${{
              contains(github.ref_name, '-rc')
              || contains(github.ref_name, '-alpha')
              || contains(github.ref_name, '-beta')
            }}
