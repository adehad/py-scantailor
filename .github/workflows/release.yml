# Release: on a pushed v* tag, test, freeze with PyInstaller and attach the
# archives to a GitHub Release. To add a platform, copy the build job.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  build:
    name: Build (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # pdm derives the version from the tag, which a shallow clone lacks.
          fetch-depth: 0

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.14"
          cache: true

      - name: Cache numba compiled functions
        uses: actions/cache@v4
        with:
          path: ${{ env.NUMBA_CACHE_DIR }}
          key: numba-${{ runner.os }}-${{ hashFiles('pdm.lock', 'src/**/*.py') }}
          # numba checks each entry against its source file's hash, so a
          # cache from an older commit is still safe to restore.
          restore-keys: numba-${{ runner.os }}-

      - name: Install dependencies
        run: pdm install --frozen-lockfile -G test -G installer

      - name: Compile translations
        run: pdm run translations

      - name: Run tests
        run: pdm run pytest

      - name: Build executables
        run: pdm run exe

      - name: Smoke test the CLI
        run: dist/ScanTailor/scantailor-cli.exe --help

      - name: Archive
        id: archive
        run: |
          name="ScanTailor-${GITHUB_REF_NAME}-windows-x64.zip"
          (cd dist && pdm run python -m zipfile -c "../${name}" ScanTailor)
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: release-windows-x64
          path: ${{ steps.archive.outputs.name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: >-
            ${{
              contains(github.ref_name, '-rc')
              || contains(github.ref_name, '-alpha')
              || contains(github.ref_name, '-beta')
            }}
