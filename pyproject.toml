[project]
name = "scantailor"
description = "Python port of the ScanTailor Application"
authors = [{ name = "Adel H", email = "26027314+adehad@users.noreply.github.com" }]
dependencies = [
    "PySide6==6.12.*",
    "pydantic>=2.14",
    "loguru>=0.7.3",
    "numpy>=2.5",
    # OpenCV 5 draws putText in a new font, which redraws every generated test and
    # sample page; moving to it means re-tuning those pages first.
    "opencv-python>=4.14,<5",
    "scikit-image>=0.26",
    "scipy>=1.18",
    "pillow>=12.3",
    "numba>=0.68",
    "pikepdf>=10.17",
    "pypdfium2>=5.14",
    "jbig2-numba @ file:///${PROJECT_ROOT}/packages/jbig2-numba",
]
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]

[project.scripts]
scantailor-cli = "scantailor.cli.main:main"

[project.gui-scripts]
scantailor = "scantailor.__main__:main"

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "scipy-stubs>=1.18.1.1",
]

installer = [
    "PyInstaller>=6.22",
]

test = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-qt>=4.5",
    "pytest-xdist>=3.8",
    "pymupdf>=1.26",
]

docs = [
    "Sphinx>=9.1",
    "furo>=2025.12.19",
    "sphinx-copybutton>=0.5.2",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

########################################################################################
# PDM Config
########################################################################################
[tool.pdm.version]
source = "scm"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
# post_install = "python -m scantailor._ui._autogen"
cov = "pytest -vv --cov-report=term-missing --cov-config=pyproject.toml --cov=src/scantailor --cov=tests {args} --cov-report=xml:dist/cov/coverage.xml --cov-report=html:dist/cov/coverage.html"
docs-screenshots = "python tools/docs_screenshots.py {args}"
docs = "sphinx-build -a -n -v -W --keep-going  -b html --color -d dist/docs_doctree docs/ {args:dist/docs}"
translations = "python tools/build_translations.py"
exe = { composite = ["translations", "pyinstaller app.spec --noconfirm --clean {args}"] }

# Can't run in pre-commit as needs autogenerated files and deps
typecheck = "pyrefly check"

########################################################################################
# External Tool Config
########################################################################################
[tool.pytest.ini_options]
# The default run skips tests marked "slow" (those that stay above about 2 s, mostly
# process-pool spawns and full pipeline renders).
#   pytest -m slow   runs only the slow tests
#   pytest -m ''     runs everything (use this as the full gate before merging)
# Tests run on one xdist worker per CPU; loadgroup keeps xdist_group-marked tests on a
# single worker. Pass -n0 to run serially, for example when debugging one test.
addopts = "-m 'not slow and not docs_screenshot' -n auto --dist loadgroup"
markers = [
    "slow: takes more than about 2 s; excluded from the default run",
    "docs_screenshot: drives the window to save the manual's PNGs; run with pytest -m docs_screenshot",
]

[tool.pyrefly]
python-version = "3.14"
project-includes = ["src"]
project-excludes = ["src/scantailor/_ui/*_ui.py"]
untyped-def-behavior = "check-and-infer-return-any"

[tool.ruff]
# The source code paths to consider, e.g., when resolving first- vs. third-party imports
src = ["scantailor", "tests"]
extend-exclude = ["./src/scantailor/_ui/*_ui.py"]

# Assume Python 3.14. (minimum supported)
target-version = "py314"

# Same as Black.
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "D",   # docstrings
    "RUF", # ruff
]
ignore = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-first-party = ["scantailor", "tests"]

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"
